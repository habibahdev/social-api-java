openapi: 3.0.3
info:
  title: API Réseau Social — Posts, Comments, Likes (Java / Spring Boot)
  description: >
    API REST développée avec Java 21 et Spring Boot 3, permettant la gestion de publications (posts),
    de commentaires et de likes, avec authentification par jeton JWT (jjwt).
  version: "1.0.0"
servers:
  - url: http://localhost:8080
    description: Serveur de développement local (port par défaut Spring Boot)

tags:
  - name: Auth
    description: Authentification et obtention du jeton JWT
  - name: Posts
    description: Gestion des publications (paginées)
  - name: Comments
    description: Gestion des commentaires
  - name: Likes
    description: Gestion des likes

security: []

paths:
  /api/login:
    post:
      tags: [Auth]
      summary: Authentifie un utilisateur et renvoie un jeton JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: email+1@email.com
              password: password
      responses:
        '200':
          description: Authentification réussie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Identifiants invalides
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /posts:
    get:
      tags: [Posts]
      summary: Liste les posts (paginée)
      parameters:
        - name: page
          in: query
          description: Numéro de page (défaut 1)
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: limit
          in: query
          description: Nombre de posts par page (défaut 10, max 50)
          schema:
            type: integer
            default: 10
            minimum: 1
            maximum: 50
      responses:
        '200':
          description: Page de résultats
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostPage'
    post:
      tags: [Posts]
      summary: Crée un nouveau post
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostCreateRequest'
            example:
              content: Mon premier post
      responses:
        '201':
          description: Post créé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '400':
          description: Champ "content" manquant ou vide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Jeton manquant ou invalide

  /posts/{id}:
    parameters:
      - $ref: '#/components/parameters/PostId'
    get:
      tags: [Posts]
      summary: Récupère un post par son id
      responses:
        '200':
          description: Détail du post
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '404':
          description: Post introuvable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      tags: [Posts]
      summary: Modifie le contenu d'un post (auteur uniquement)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostCreateRequest'
            example:
              content: Contenu modifié
      responses:
        '204':
          description: Post modifié avec succès
        '401':
          description: Jeton manquant ou invalide
        '403':
          description: L'utilisateur n'est pas l'auteur du post
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Post introuvable
    delete:
      tags: [Posts]
      summary: Supprime un post (auteur uniquement)
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Post supprimé avec succès
        '401':
          description: Jeton manquant ou invalide
        '403':
          description: L'utilisateur n'est pas l'auteur du post
        '404':
          description: Post introuvable

  /posts/{postId}/comments:
    parameters:
      - $ref: '#/components/parameters/PostIdPath'
    get:
      tags: [Comments]
      summary: Liste les commentaires d'un post
      responses:
        '200':
          description: Liste des commentaires
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Comment'
        '404':
          description: Post introuvable
    post:
      tags: [Comments]
      summary: Ajoute un commentaire à un post
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommentCreateRequest'
            example:
              message: Super post !
      responses:
        '201':
          description: Commentaire créé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
        '400':
          description: Champ "message" manquant ou vide
        '401':
          description: Jeton manquant ou invalide
        '404':
          description: Post introuvable

  /comments/{id}:
    parameters:
      - $ref: '#/components/parameters/CommentId'
    get:
      tags: [Comments]
      summary: Récupère un commentaire par son id
      responses:
        '200':
          description: Détail du commentaire
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
        '404':
          description: Commentaire introuvable
    put:
      tags: [Comments]
      summary: Modifie un commentaire (auteur uniquement)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommentCreateRequest'
            example:
              message: Message modifié
      responses:
        '204':
          description: Commentaire modifié avec succès
        '401':
          description: Jeton manquant ou invalide
        '403':
          description: L'utilisateur n'est pas l'auteur du commentaire
        '404':
          description: Commentaire introuvable
    delete:
      tags: [Comments]
      summary: Supprime un commentaire (auteur uniquement)
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Commentaire supprimé avec succès
        '401':
          description: Jeton manquant ou invalide
        '403':
          description: L'utilisateur n'est pas l'auteur du commentaire
        '404':
          description: Commentaire introuvable

  /posts/{postId}/likes:
    parameters:
      - $ref: '#/components/parameters/PostIdPath'
    get:
      tags: [Likes]
      summary: Liste les utilisateurs ayant liké le post
      responses:
        '200':
          description: Liste des utilisateurs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        '404':
          description: Post introuvable
    post:
      tags: [Likes]
      summary: Like le post (utilisateur authentifié)
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Like ajouté avec succès
        '401':
          description: Jeton manquant ou invalide
        '404':
          description: Post introuvable
    delete:
      tags: [Likes]
      summary: Retire le like du post (utilisateur authentifié)
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Like retiré avec succès
        '401':
          description: Jeton manquant ou invalide
        '404':
          description: Post introuvable

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Jeton obtenu via POST /api/login, à transmettre dans l'en-tête
        Authorization sous la forme "Bearer <token>"

  parameters:
    PostId:
      name: id
      in: path
      required: true
      description: Identifiant du post
      schema:
        type: integer
        format: int64
    PostIdPath:
      name: postId
      in: path
      required: true
      description: Identifiant du post parent
      schema:
        type: integer
        format: int64
    CommentId:
      name: id
      in: path
      required: true
      description: Identifiant du commentaire
      schema:
        type: integer
        format: int64

  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        email:
          type: string
          format: email
          example: email+1@email.com
        name:
          type: string
          example: name+1

    Post:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        content:
          type: string
          example: content 1
        publishedAt:
          type: string
          format: date-time
          example: "2026-09-14T10:00:00Z"
        author:
          $ref: '#/components/schemas/User'
        likedBy:
          type: array
          items:
            $ref: '#/components/schemas/User'

    PaginationMeta:
      type: object
      properties:
        page:
          type: integer
          example: 2
        limit:
          type: integer
          example: 5
        total:
          type: integer
          format: int64
          example: 50
        totalPages:
          type: integer
          example: 10

    PostPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Post'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    Comment:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        message:
          type: string
          example: Super post !
        publishedAt:
          type: string
          format: date-time
          example: "2026-09-14T10:05:00Z"
        author:
          $ref: '#/components/schemas/User'

    PostCreateRequest:
      type: object
      required: [content]
      properties:
        content:
          type: string
          example: Mon premier post

    CommentCreateRequest:
      type: object
      required: [message]
      properties:
        message:
          type: string
          example: Super post !

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: email+1@email.com
        password:
          type: string
          format: password
          example: password

    LoginResponse:
      type: object
      properties:
        token:
          type: string
          example: eyJhbGciOiJIUzI1NiJ9...

    Error:
      type: object
      properties:
        error:
          type: string
          example: Le champ "content" est obligatoire.
